<svg width="760" height="660" viewBox="0 0 760 660" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The full process inside the AI SDLC Orchestrator, backend and engine</title>
<desc>A swimlane diagram with two lanes, Backend and Engine. A webhook is received by the backend, which queues a workflow run and hands off to the engine. The engine's GraphBuilder compiles the workflow spec, then nodes execute in sequence: plan, code, review, test. A routing and retry step decides whether to loop back for revision, continue, or escalate. The engine checkpoints state and pauses at a human interrupt, handing back to the backend, which notifies the human. The human approves or rejects, the engine resumes and a VCS adapter opens or merges the pull request, and the run closes with a full audit trail spanning both lanes.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
  .box { stroke-width: 1; }
  .backend { fill: #eef0f2; stroke: #8a94a3; }
  .engine { fill: #efe9fb; stroke: #9a7fd1; }
  .amber { fill: #fdf3e0; stroke: #d9a441; }
  .th { font: 600 13px sans-serif; fill: #1a1a1a; }
  .ts { font: 11px sans-serif; fill: #444; }
  .arr { stroke: #555; stroke-width: 1.5; fill: none; }
</style>

<rect x="60" y="20" width="260" height="36" rx="6" class="box backend"/>
<text class="th" x="190" y="43" text-anchor="middle">Backend (ASP.NET Core)</text>
<rect x="440" y="20" width="260" height="36" rx="6" class="box engine"/>
<text class="th" x="570" y="43" text-anchor="middle">Engine (Python + LangGraph)</text>

<rect x="60" y="80" width="260" height="56" rx="8" class="box backend"/>
<text class="th" x="190" y="102" text-anchor="middle">1. Webhook received</text>
<text class="ts" x="190" y="120" text-anchor="middle">push, PR, or scheduled event</text>
<line x1="190" y1="136" x2="190" y2="160" class="arr" marker-end="url(#arrow)"/>

<rect x="60" y="160" width="260" height="56" rx="8" class="box backend"/>
<text class="th" x="190" y="182" text-anchor="middle">2. Workflow run queued</text>
<text class="ts" x="190" y="200" text-anchor="middle">POST /internal/runs</text>
<line x1="320" y1="188" x2="440" y2="188" class="arr" marker-end="url(#arrow)"/>

<rect x="440" y="160" width="260" height="56" rx="8" class="box engine"/>
<text class="th" x="570" y="182" text-anchor="middle">3. GraphBuilder compiles spec</text>
<text class="ts" x="570" y="200" text-anchor="middle">workflow YAML → StateGraph</text>
<line x1="570" y1="216" x2="570" y2="240" class="arr" marker-end="url(#arrow)"/>

<rect x="440" y="240" width="260" height="56" rx="8" class="box engine"/>
<text class="th" x="570" y="262" text-anchor="middle">4. Nodes execute</text>
<text class="ts" x="570" y="280" text-anchor="middle">plan → code → review → test</text>
<line x1="570" y1="296" x2="570" y2="320" class="arr" marker-end="url(#arrow)"/>

<rect x="440" y="320" width="260" height="56" rx="8" class="box engine"/>
<text class="th" x="570" y="342" text-anchor="middle">5. Routing + retry decide</text>
<text class="ts" x="570" y="360" text-anchor="middle">loop, continue, or escalate</text>
<path d="M700,340 C742,340 742,268 700,268" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="748" y="304" text-anchor="start" transform="rotate(90 748 304)">revise loop</text>
<line x1="570" y1="376" x2="570" y2="400" class="arr" marker-end="url(#arrow)"/>

<rect x="440" y="400" width="260" height="56" rx="8" class="box engine"/>
<text class="th" x="570" y="422" text-anchor="middle">6. Checkpoints &amp; pauses</text>
<text class="ts" x="570" y="440" text-anchor="middle">interrupt node reached</text>
<line x1="440" y1="428" x2="320" y2="428" class="arr" marker-end="url(#arrow)"/>

<rect x="60" y="400" width="260" height="56" rx="8" class="box backend"/>
<text class="th" x="190" y="422" text-anchor="middle">7. Notifies you</text>
<text class="ts" x="190" y="440" text-anchor="middle">approval pending</text>
<line x1="190" y1="456" x2="190" y2="480" class="arr" marker-end="url(#arrow)"/>

<rect x="60" y="480" width="260" height="56" rx="8" class="box amber"/>
<text class="th" x="190" y="502" text-anchor="middle">8. You approve / reject</text>
<text class="ts" x="190" y="520" text-anchor="middle">POST /runs/{id}/approval</text>
<line x1="320" y1="508" x2="440" y2="508" class="arr" marker-end="url(#arrow)"/>

<rect x="440" y="480" width="260" height="56" rx="8" class="box engine"/>
<text class="th" x="570" y="502" text-anchor="middle">9. Resume: VCS adapter</text>
<text class="ts" x="570" y="520" text-anchor="middle">opens PR / merges</text>
<line x1="570" y1="536" x2="500" y2="560" class="arr" marker-end="url(#arrow)"/>

<rect x="150" y="560" width="460" height="56" rx="8" class="box backend"/>
<text class="th" x="380" y="582" text-anchor="middle">10. Run closed</text>
<text class="ts" x="380" y="600" text-anchor="middle">full audit trail recorded in run_events</text>
</svg>
